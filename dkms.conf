#
# DKMS configuration for the owgw-spi-master kernel module.
#
# After copying this directory to /usr/src/owgw-spi-master-0.1.0, run:
#   sudo dkms add owgw-spi-master/0.1.0
#   sudo dkms build owgw-spi-master/0.1.0
#   sudo dkms install owgw-spi-master/0.1.0
#   sudo modprobe owgw-spi-master
#

PACKAGE_NAME="owgw-spi-master"
PACKAGE_VERSION="0.1.0"

# Match the running kernel by default; override via DKMS flags if you need
# a specific kernel tree.
MAKE[0]="'make' KDIR=${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"

# What ends up under /lib/modules/<kver>/updates/dkms/
BUILT_MODULE_NAME[0]="owgw-spi-master"
BUILT_MODULE_LOCATION[0]=""

# Where the .ko gets installed.
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Rebuild automatically whenever a new kernel is installed.
AUTOINSTALL="yes"

# No special cleanup hooks needed; the module uses no extra firmware or
# config files.
POST_INSTALL=""

# Sources DKMS should ship into the build tree. We take everything in
# this directory: the Makefile, the C source, the vendored header under
# include/, and this dkms.conf itself.
MAKE_MATCH[0]="^Makefile$"
MAKE_MATCH[1]="^owgw-spi-master\\.c$"
MAKE_MATCH[2]="^include/.+\\.h$"
MAKE_MATCH[3]="^dkms\\.conf$"
